name: Publish blog post

# Two triggers:
#   1. repository_dispatch — post-to backend POSTs to GitHub after uploading a
#      new article to S3, which fires this workflow. Payload includes the
#      article slug so we can log which article we're deploying.
#   2. workflow_dispatch — manual "Run workflow" button in the Actions UI,
#      useful for redeploying without publishing anything new (e.g. after
#      hand-editing an .md file in the S3 bucket).
on:
  repository_dispatch:
    types: [publish-blog]
  workflow_dispatch:

concurrency:
  # If multiple articles publish back-to-back, coalesce — only the final one
  # needs to actually deploy. Avoids two builds racing on `dist/`.
  group: publish-blog
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      # Overrides for scripts/sync-posts.mjs if we ever want to redirect to
      # a different bucket (e.g. staging). Defaults match Spotless prod.
      POST_TO_BLOG_BUCKET: post-to-blog-spotless-homes
      POST_TO_BLOG_REGION: us-east-2

    steps:
      # Any step BEFORE the checkout can't set a working-directory that lives
      # inside the checked-out tree — the tree doesn't exist yet. Log without
      # one, then check out, then run cleanerflow/-scoped commands.
      - name: Log dispatch context
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Article slug: ${{ github.event.client_payload.slug || 'n/a (manual dispatch)' }}"

      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cleanerflow/package-lock.json

      - name: Install dependencies
        working-directory: cleanerflow
        run: npm ci

      # `prebuild` runs sync-posts.mjs which pulls latest .md files from S3
      # into src/data/blog-posts/ so Vite's build sees them. Then `build`
      # produces dist/.
      #
      # VITE_* env must be injected here — Vite substitutes import.meta.env.*
      # at build time. Without them, forms show "Email is not configured" and
      # every blog publish silently reships a broken bundle. Values are stored
      # as GitHub secrets on this repo (set 2026-07-31 after that regression).
      - name: Build site
        working-directory: cleanerflow
        env:
          VITE_SERVICE_ID: ${{ secrets.VITE_SERVICE_ID }}
          VITE_USER_ID: ${{ secrets.VITE_USER_ID }}
          VITE_ADMIN_TEMPLATE_ID: ${{ secrets.VITE_ADMIN_TEMPLATE_ID }}
          VITE_CAREERS_TEMPLATE_ID: ${{ secrets.VITE_CAREERS_TEMPLATE_ID }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_CC: ${{ secrets.VITE_ADMIN_CC }}
        run: |
          echo "DEBUG VITE_SERVICE_ID len=${#VITE_SERVICE_ID}"
          echo "DEBUG VITE_USER_ID len=${#VITE_USER_ID}"
          echo "DEBUG VITE_ADMIN_TEMPLATE_ID len=${#VITE_ADMIN_TEMPLATE_ID}"
          echo "DEBUG VITE_CAREERS_TEMPLATE_ID len=${#VITE_CAREERS_TEMPLATE_ID}"
          echo "DEBUG VITE_ADMIN_EMAIL len=${#VITE_ADMIN_EMAIL}"
          echo "DEBUG VITE_ADMIN_CC len=${#VITE_ADMIN_CC}"
          npm run build

      # Existing deploy.sh: sync dist/ to www.spotless.homes bucket +
      # invalidate CloudFront. Runs from the cleanerflow/ dir.
      - name: Deploy
        working-directory: cleanerflow
        run: bash scripts/deploy.sh

      - name: Done
        run: echo "Deployed. Article should be live within CloudFront invalidation window (~30s)."
